      "UpdateInvoice": {
        "description": "Update the custom information associated with the invoice.\nAny attributes are added to existing attributes.\nTo reset or delete a specific attribute, set it to `null`.\n",
        "example": {
          "customInformation": {
            "department": "Engineering",
            "project": "Tokyo"
          },
          "lineItems": [
            {
              "customInformation": {
                "city": null,
                "targetCountry": "Switzerland"
              }
            },
            {
              "customInformation": {}
            },
            {
              "customInformation": null
            },
            {}
          ]
        },
        "properties": {
          "customInformation": {
            "additionalProperties": true,
            "description": "Dictionary of custom information associated with the invoice.\nThe data of the object is merged with the existing values on a top level.\nDeeper levels are overwritten by the new data and not merged.\nTo reset a specific attribute, set it to `null`. Yokoy treats empty values as `null`.\n",
            "example": {
              "customKey": "customValue"
