      "DateRange": {
        "items": {
          "example": [
            "2023-02-21",
            "2023-02-22"
          ],
          "format": "date",
          "pattern": "^\\d{4}\\-(0[1-9]|1[012])\\-(0[1-9]|[12][0-9]|3[01])$",
          "type": "string"
        },
        "maxItems": 2,
        "minItems": 2,
        "type": "array"
      },
      "DateString": {
        "example": "2024-02-21",
        "format": "date",
        "pattern": "^\\d{4}\\-(0[1-9]|1[012])\\-(0[1-9]|[12][0-9]|3[01])$",
        "type": "string"
