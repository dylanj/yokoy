{
  "components": {
    "parameters": {
      "ExportTaskQueryFilter": {
        "description": "Filter string used to restrict the data returned. You can use [SCIM specification](https://tools.ietf.org/html/rfc7644#section-3.4.2.2) filters. The fields to filter differ from other endpoints. The filterable attributes for this endpoint are `created`, `fullDate`, `postingDate`, `type`, `facilityId` and `exportMethod`.",
        "example": "created ge 2025-01-23 and facilityId eq expense",
        "in": "query",
        "name": "filter",
        "schema": {
          "type": "string"
        }
      },
      "LegalEntityIdInPath": {
        "description": "Yokoy unique ID of the legal entity (company).",
        "example": "aB9jQoE3HE",
        "in": "path",
        "name": "legalEntityId",
        "required": true,
        "schema": {
          "pattern": "[\\w-]+",
          "type": "string"
        }
      },
      "PaginationCount": {
        "description": "Optional count for paginating. When provided, the results are paginated. Without `count`, no pagination is provided.\nThe maximum number of items that can be included in a paginated response is `100`.\nWhen paginated, the response includes the `itemsPerPage` attribute.\nIf the number of items available is greater than or equal to `count`, it also includes the `nextCursor` attribute, which can be used to fetch the subsequent page of items.\n",
        "example": 30,
        "in": "query",
        "name": "count",
        "required": false,
        "schema": {
          "maximum": 100,
          "type": "number"
        }
      },
      "PaginationCursor": {
        "description": "Optional cursor for paginating. When provided, the API fetches a subsequent page of items.\nThe subsequent page is identified by the value given in `nextCursor` in the previous response.\n`cursor` can only be used if the `count` attribute is passed as a query parameter.\n",
        "example": "06x2u4nagAMEq3gGMoch",
        "in": "query",
        "name": "cursor",
        "required": false,
        "schema": {
          "type": "string"
        }
      },
      "QueryFilter": {
        "description": "Filter string used to restrict the data returned. You can use [SCIM specification](https://tools.ietf.org/html/rfc7644#section-3.4.2.2) filters.",
        "example": "created ge 2024-03-02T09:00.000Z and customInformation.customField eq foo",
        "in": "query",
        "name": "filter",
        "schema": {
          "type": "string"
        }
      },
      "YokoyAuthMethod": {
        "example": "yokoy",
        "in": "header",
        "name": "X-Yk-Auth-Method",
        "required": true,
        "schema": {
          "enum": [
            "yokoy"
          ],
          "type": "string"
        }
      },
      "YokoyCorrelationId": {
        "description": "Correlation ID that can be used to trace a request in the flow.",
        "example": "4ea8985e-80a2-40a0-8a40-401a1a1374b3",
        "in": "header",
        "name": "X-Yk-Correlation-Id",
        "required": false,
        "schema": {
          "type": "string"
        }
      }
    },
    "responses": {
      "Conflict": {
        "content": {
          "application/json": {
            "example": {
              "code": 409,
              "message": "Request conflict with the current state of the target resource."
            },
            "schema": {
              "$ref": "#/components/schemas/Error"
            }
          }
        },
        "description": "Request conflict with the current state of the target resource."
      },
      "Forbidden": {
        "content": {
          "application/json": {
            "example": {
              "code": 403,
              "message": "User not authorized to access organization"
            },
            "schema": {
              "$ref": "#/components/schemas/Error"
            }
          }
        },
        "description": "The client is not authorized to perform the requested operation."
      },
      "Found": {
        "description": "Redirect URL of a requested resource.",
        "headers": {
          "Location": {
            "schema": {
              "type": "string"
            }
          }
        }
      },
      "GatewayError": {
        "content": {
          "application/json": {
            "example": {
              "code": 502,
              "message": "Gateway error"
            },
            "schema": {
              "$ref": "#/components/schemas/Error"
            }
          }
        },
        "description": "An issue occurred in a downstream service. Please try again later."
      },
      "HttpValidationError": {
        "content": {
          "application/json": {
            "example": {
              "code": 400,
              "errors": [
                {
                  "field": "Yokoy Field",
                  "message": "Yokoy Field is mandatory"
                }
              ],
              "message": "Validation Error"
            },
            "schema": {
              "$ref": "#/components/schemas/HttpError",
              "additionalProperties": true
            }
          }
        },
        "description": "The request was not valid."
      },
      "InsufficientData": {
        "content": {
          "application/json": {
            "example": {
              "code": 422,
              "message": "Insufficient data"
            },
            "schema": {
              "$ref": "#/components/schemas/Error"
            }
          }
        },
        "description": "The request cannot be processed due to insufficient data."
      },
      "InternalError": {
        "content": {
          "application/json": {
            "example": {
              "code": 500,
              "message": "Server error"
            },
            "schema": {
              "$ref": "#/components/schemas/Error"
            }
          }
        },
        "description": "An internal error occurred."
      },
      "InvalidFilter": {
        "content": {
          "application/json": {
            "example": {
              "code": 400,
              "message": "Invalid filter string: foo e bar"
            },
            "schema": {
              "$ref": "#/components/schemas/Error"
            }
          }
        },
        "description": "The request was not valid."
      },
      "NotFound": {
        "content": {
          "application/json": {
            "example": {
              "code": 404,
              "message": "Resource not found"
            },
            "schema": {
              "$ref": "#/components/schemas/Error"
            }
          }
        },
        "description": "The specified resource was not found."
      },
      "ServiceUnavailable": {
        "content": {
          "application/json": {
            "example": {
              "code": 503,
              "message": "Service unavailable"
            },
            "schema": {
              "$ref": "#/components/schemas/Error"
            }
          }
        },
        "description": "The server is unavailable. Please try again later"
      },
      "TooManyRequests": {
        "content": {
          "application/json": {
            "example": {
              "code": 429,
              "message": "Too many requests"
            },
            "schema": {
              "$ref": "#/components/schemas/Error"
            }
          }
        },
        "description": "The request cannot be processed by the server due to too many concurrent requests."
      },
      "Unauthorized": {
        "content": {
          "application/json": {
            "example": {
              "code": 401,
              "message": "Token expired"
            },
            "schema": {
              "$ref": "#/components/schemas/Error"
            }
          }
        },
        "description": "The server was unable to establish the identity of the client."
      },
      "ValidationError": {
        "content": {
          "application/json": {
            "example": {
              "code": 400,
              "message": "ValidationError: name is mandatory"
            },
            "schema": {
              "$ref": "#/components/schemas/Error"
            }
          }
        },
        "description": "The request was not valid."
      }
