    "/legal-entities/{legalEntityId}/expense-export-facilities/{exportFacility}/export-tasks": {
      "parameters": [
        {
          "$ref": "#/components/parameters/LegalEntityIdInPath"
        },
        {
          "description": "Type of expense that determines the export facility to be used. There are three standard types:\n- `expense` for single expenses, per diems and mileage expenses,\n- `card` for card transactions,\n- `travel` for travel expenses from third-party solutions.\n",
          "in": "path",
          "name": "exportFacility",
          "required": true,
          "schema": {
            "enum": [
              "expense",
              "card",
              "travel"
            ],
            "example": "expense",
            "type": "string"
          }
        }
      ],
      "post": {
        "description": "Triggers an expense export in Yokoy. It returns the ID of the export job.",
        "operationId": "triggerExpenseExport",
        "requestBody": {
          "content": {
            "application/json": {
              "schema": {
                "properties": {
                  "documentIds": {
                    "description": "List of Yokoy expense IDs to be exported.\nRequired if `exportScope` is `documentIds`. It returns an error if the array length is less than one.\n",
                    "example": [
                      "aB9jQoE3HE"
                    ],
                    "items": {
                      "type": "string"
                    },
                    "type": "array"
                  },
                  "earliestPostingDate": {
                    "description": "Earliest allowed posting date. For expenses with an earlier posting date, the posting date is replaced with the earliest allowed posting date (to avoid posting to already closed books).\nThe earlier posting date must follow these rules:\n  - it must be an ISO date in the format YYYY-MM-DD (e.g. 2025-03-18)\n  - it must be within 1 year (both past and future) of when an export was triggered.\n  For example, if the date on which you trigger the export job is 2025-03-18, then any date between `2024-03-18` and `2026-03-18` is valid.\n",
                    "example": "2023-03-31",
                    "pattern": "\\d{4}-\\d{2}-\\d{2}",
                    "type": "string"
                  },
                  "exportScope": {
                    "description": "Determines the expenses to be exported. You can export either all expenses in the scope of the export facility that are ready for export (`all`) or a determined set of expenses that are specified by their Yokoy unique IDs (`documentIds`).\n",
                    "enum": [
                      "all",
                      "documentIds"
                    ],
                    "example": "all",
                    "type": "string"
                  },
                  "exporterId": {
                    "description": "Yokoy unique ID of the user on behalf of which the export job is run. The user must have the finance role for the legal entity to trigger an export.",
                    "example": "zbRCb62OlcF8WcuOKVs9",
                    "type": "string"
                  }
                },
                "required": [
                  "exportScope",
                  "exporterId",
                  "earliestPostingDate"
                ],
                "type": "object"
              }
            }
          },
          "required": true
        },
        "responses": {
          "200": {
            "content": {
              "application/json": {
                "schema": {
                  "properties": {
                    "resource": {
                      "description": "Task ID of the export job",
                      "example": "h6tplNlvNxnHUpeAwd7D",
                      "type": "string"
                    }
                  },
                  "type": "object"
                }
              }
            },
            "description": "OK"
          },
          "204": {
            "description": "Nothing to export"
          },
          "400": {
            "content": {
              "application/json": {
                "example": {
                  "code": 400,
                  "message": "Invalid request body"
                },
                "schema": {
                  "$ref": "#/components/schemas/Error"
                }
              }
            },
            "description": "The provided request body is invalid"
          },
          "401": {
            "$ref": "#/components/responses/Unauthorized"
          },
          "403": {
            "$ref": "#/components/responses/Forbidden"
          },
          "404": {
            "$ref": "#/components/responses/NotFound"
          },
          "422": {
            "$ref": "#/components/responses/InsufficientData"
          },
          "429": {
            "$ref": "#/components/responses/TooManyRequests"
          },
          "500": {
            "$ref": "#/components/responses/InternalError"
          },
          "502": {
            "$ref": "#/components/responses/GatewayError"
          },
          "503": {
            "$ref": "#/components/responses/ServiceUnavailable"
          }
        },
        "security": [
          {
            "OAuth2": []
          }
        ],
        "summary": "Trigger expense export",
        "tags": [
          "Finance export"
        ]
      }
    },
