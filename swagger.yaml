      "InvoiceQrInformation": {
        "description": "Invoice QR information. Supports Swiss QR-bill.",
        "properties": {
          "iban": {
            "description": "IBAN (International Bank Account Number). It can be a standard IBAN or a QR-IBAN associated with the payment creditor. Only Swiss IBAN numbers are allowed.",
            "example": "CH5604835012345678009",
            "nullable": true,
            "type": "string"
          },
          "referenceNumber": {
            "description": "Payment reference. It can be either a QR reference or a Creditor reference. QR reference or Creditor Reference (ISO 11649). The QR reference is printed in blocks of 5 characters (beginning with 2 characters, then 5x5-character groups). The Creditor Reference is printed in blocks of 4 characters.",
            "example": "210000000003139471430009017",
            "nullable": true,
            "type": "string"
          },
          "structuredMessage": {
            "description": "Billing information. Coded information for automated booking of the payment. This information may be used for automating accounts payable processes, for instance. The data is not forwarded with the payment but it is printed on the payment part of the bill. The coding of the element always begins with “//” (slash slash) followed by the double-digit, abbreviated name of the proposed version of the “Structured information for the bill issuer” that is being used. The first two characters are reserved as the code for the rule defining how the remaining characters of this field should be interpreted. For more information on coding, see www.paymentstandards.ch.",
            "example": "//S1/10/1234/11/201021/30/102673386/32/7.7/40/0:30",
            "nullable": true,
            "type": "string"
          },
          "type": {
            "description": "Reference type. If `iban` is a QR-IBAN, then the type is `QRR` (QR reference). Otherwise, it can be `SCOR` (Creditor reference) or `NON` (without reference).\n",
            "example": "NON",
            "nullable": true,
            "type": "string"
          },
          "unstructuredMessage": {
            "description": "Additional description. Used give the payment purpose or for additional textual information about payments with a structured reference. Unstructured references are printed on the payment part under the heading “Additional information”.",
            "example": "Order from 15.10. 2020",
            "nullable": true,
            "type": "string"
          }
        },
        "readOnly": true,
        "type": "object"
      },
