  "tags": [
    {
      "description": "Legal entity or company. An organization can have multiple legal entities.",
      "name": "Legal entity"
    },
    {
      "description": "Cost objects (also called cost centers) is a hierarchical construct to which costs that occur within a company can be assigned. Cost objects are created at legal entity level and can be used for expenses, trips, and invoices.\nApprovers and delegates should be specified using the Yokoy user ID. For any unrecognized IDs, Yokoy creates or updates the cost object attribute with the value `null`. For example, if you pass `Y6cp2G30M` as the `approverId` and no user exists for that ID, Yokoy updates the approver ID attribute as `null`.\n",
      "name": "Cost center"
    },
    {
      "description": "Extend the offered and Yokoy-managed foreign exchange rates (Open Exchange Rates, CNB, NPB and NBS national bank rates) with your own customer-specific FX rates. The created FX rate sources are equivalent to Yokoy-managed FX rate sources and can be applied in **Admin > Company**, **General**. Currencies are assigned on a legal entity level.\n",
      "name": "FX rates"
    },
    {
      "description": "Tax rates. Tax rates apply to expenses, trips, and invoices. In Yokoy, you can consult them in **Admin > VAT / Tax rates**. For invoices, you can set up advanced tax components to adjust to complex tax scenarios. See [Set up advanced tax rates for invoices](https://help.yokoy.ai/en/articles/223727-set-up-advanced-tax-rates-for-invoices).",
      "name": "Tax rates"
    },
    {
      "description": "Company card entity in Yokoy. Company cards can be Yokoy Pay cards or external cards.",
      "name": "Company card"
    },
    {
      "description": "Tag is a custom dimension that can be added to each category that help map additional information to that spend and use it at multiple levels, such as analytics or for accounting purposes.\nTags are often used to enhance Yokoy’s data model for:\n- **management reporting** along multi-dimensional classifications (matrix model).\nFor example, project accounting next to cost accounting (cost centers and cost carriers/projects in a matrix), activity-based controlling (ABC) alongside cost or project accounting, or asset management (e.g. asset capitalisation schedules)\n- **classifications** for processing purposes.\nFor example, approval groups independent of cost center or project accounting structure.\nEach tag belongs to a tag dimension. Tag dimensions are created in Yokoy (**Admin > Company**).\n",
      "name": "Tag"
    },
    {
      "description": "Users in Yokoy reflect the fundamental roles of submitter, approver, and finance user. Mandatory user information depends on the specific organization requirements and Yokoy features enabled.\nEmail addresses must be unique for the organization. You cannot create two users with the same email address. If the email address provided already exists in the organization, the API returns an error.\n\nBank information can be provided as part of POST, PUT, and PATCH requests, however, the response does not return this information for security reasons.\n\n**Note**: You can‘t use the User endpoints to determine the roles and permissions assigned to a user. You can only use the endpoints to create a new user.\nRoles and permissions are granted to a user in Yokoy (**Admin > Finance/HR roles**). You must have previously created the user before assigning roles and permissions.\n\n- **Booking strategy**: You can export expenses based on the user selected currency (instead of the company currency or the original expense currency). If you choose this option, you need to provide the user's currency.\n- **Approval strategy**: If you plan to approve expenses using a line manager approval strategy, then you need to enter a line manager for each user.\n- **Expense accounting**: If expenses are to be posted via the employee vendor account, the field `employeeId` should reflect employee vendor account number. If you want to track the employee number, you should set up a custom field to add this information.\n- **User policy**: You can assign rank-specific expense policies to certain users and user groups to determine applicable expense rules, per diem and mileage rates, as well as expense categories. If you choose this option, then you need to enter the policy ID.\n\nFor any unrecognized IDs, Yokoy creates or updates the user attribute with the value `null`. For example, if you pass `Y6cp2G30M` as the `lineManagerId` and no user exists for that ID, Yokoy updates the line manager ID attribute as `null`.\n\nTo guarantee spend data traceability, when you delete a user via the Yokoy API, the email is changed to an email address with the format: `deleted_user_` + user ID. For example, `deleted_user_lK6jo1GmSkXJzSyZSA2f@localhost.invalid`. The user is still displayed in **HR > User management** with a deleted tag and can’t be re-activated or edited. The user can still be retrieved via the Yokoy API using the Yokoy user ID. However, the user is not returned if you retrieve all users using a GET method. Deleted users can’t be re-activated in any way.\n",
      "name": "User"
    },
    {
      "description": "An expense is a cost incurred during the performance of a business activity. Employees can create reimbursable or non-reimbursable expenses. The Expense endpoints let you query all expense types managed in Yokoy: receipt, receiptless, mileage, and per diem. You can query individual expenses included as part of a trip.\n",
      "name": "Expense"
    },
    {
      "description": "A transaction is a cleared payment that is made using a credit, debit, or prepaid card. The card issuer can be either Yokoy or a third party that has been integrated with Yokoy.\n",
      "name": "Transaction"
    },
    {
      "description": "Card account associated to one of Yokoy's card programs. Only active card accounts are allowed to order new cards.\n",
      "name": "Card account"
    },
    {
      "description": "Categories for expenses (also called booking accounts). These categories only apply to expenses and trips. For invoices, use supplier invoice categories.",
      "name": "Expense category"
    },
    {
      "description": "An employee policy determines the settings made available to a group of employees. A policy determines:\n- **categories**: the categories available to users to select.\n- **tags**: tags applicable to those users\n- **expense rules**: the expense rules used to calculate expenses for those users.\n- **per diems**: applicable rules per diems at a global level, irrespective of whether the conditions are met for applicability.\n- **mileage*: applicable rates at a global level, irrespective of the employee’s mileage counter or border crossings.\n\nYou can use the API to set the categories available to users who have been assigned the policy. To set tags, expense rules, per diems and mileage rates, use the Yokoy UI.\n",
      "name": "Policy"
    },
    {
      "description": "A trip is a collection of various types of expenses that occurred on a business trip over a period of time.",
      "name": "Trip"
    },
    {
      "description": "In the Yokoy API, invoices can only be created or retrieved. You can only update custom information via API.\nTo update other attributes or delete the invoice, use the Yokoy web app.\n",
      "name": "Invoice"
    },
    {
      "description": "Categories for invoices (equivalent to GL accounts in financial systems). These categories only apply to invoices. For expenses and trips, use expense categories.",
      "name": "Invoice category"
    },
    {
      "description": "Payment terms determine the expectation of payment agreed between the company and the supplier. By default, all payment terms can be used with any supplier of the legal entity. However, you can restrict a payment term to a specific supplier by setting `supplierSpecific` to `true` and associating the payment term ID in the Supplier master data.",
      "name": "Invoice payment terms"
    },
    {
      "description": "Companies that supply your company with goods, services, items. The Supplier entity contains information on the name, address, and bank accounts of the supplier.\nSuppliers can be set up for different legal entities with default settings at each legal entity level.\nSuppliers must first be created for the organization at `/suppliers` with their basic definition such as name, address, tax number and bank accounts.\nThen they can be created legal entity-level at `/legal-entities/{entityId}/suppliers` with the organization supplier ID in `supplierId`. Without creating a legal entity supplier, the supplier does not appear in Yokoy (in **Invoice processor > Suppliers**).\nLegal entity suppliers can be updated/created just for certain applicable fields.\nTo add (POST) or update (PATCH or PUT) a complete legal entity supplier record (e.g. the name of the supplier, contact or banking information), you need to add or update the organization supplier first. These changes are automatically progpaged to the legal entity suppliers (i.e. the same supplier may supply several legal entities) linked to that organization supplier. Then in a subsequent call to the legal entity supplier endpoint, you can update the legal entity supplier.\n\n**NOTE**: When the `Enable InternalSupplierID` setting is active at organization level, the `internalSupplierId` attribute is mandatory to point the right supplier.\nIt must use the following pattern: `externalId` of the organization supplier + '_' + Yokoy ID of the legal entity.\n",
      "name": "Supplier"
    },
    {
      "description": "Purchase orders are legal orders that companies send to their suppliers to buy items, services, products. Yokoy uses purchase orders to perform two-way and three-way matching (matching invoice line items with purchase order line items).",
      "name": "Purchase order"
    },
    {
      "description": "Goods receipt are usually provided by suppliers when the goods of an order are delivered. Yokoy uses goods receipts to perform three-way matching (controlling invoice spending by checking quantities invoiced against the quantities delivered in the goods receipt).",
      "name": "Goods receipt"
    },
    {
      "description": "Invoices that are not present in Yokoy, but that are used for matching in purchase orders and goods receipts.",
      "name": "External invoice"
    },
    {
      "description": "Finance export mechanism in Yokoy. The Yokoy API exposes three different endpoints for the management of finance exports:\n1. `/export-tasks` to trigger an export (separate endpoints for the expense and the invoice module).\nThis action is equivalent to clicking the \"Export\" button under Finance > Export within the Yokoy application.\nAs a result of a successful export, the expenses/invoices are set to the exported state.\n2. `/export-tasks/{exportTaskId}` to poll the details (in particular the status) of the asynchronous export job.\n3. `/export-tasks/{exportTaskId}/artefacts` to fetch the artefacts for those export facilities that support this functionality.\n\nTo generate the standard Yokoy export artefacts, the export facility \"Yokoy Standard Export (API)\" must be selected in Yokoy (Admin > Integrations).\nThe data model of the standard export artefacts (ExpenseExportArtefact and InvoiceExportArtefact) is described in the <a href=\"https://api.yokoy.ai/v1/swagger.json\">following OpenAPI specification</a>.\n",
      "name": "Finance export"
    }
  ]
