    "/legal-entities/{legalEntityId}/invoice-export-facilities/{exportFacility}/export-tasks": {
      "parameters": [
        {
          "$ref": "#/components/parameters/LegalEntityIdInPath"
        },
        {
          "description": "ID of the invoice export facility. The ID can be found in **Admin > Integrations** in the **Invoice export** tab by opening the wizard for the required export facility.\n\nThis export facility must be active in Yokoy.\n",
          "example": "dfP59n4vLVvO6KWj27pS",
          "in": "path",
          "name": "exportFacility",
          "required": true,
          "schema": {
            "pattern": "[\\w-]+",
            "type": "string"
          }
        },
        {
          "$ref": "#/components/parameters/YokoyCorrelationId"
        }
      ],
      "post": {
        "description": "Triggers an invoice export in Yokoy. It returns the ID of the export job.",
        "operationId": "triggerInvoiceExport",
        "requestBody": {
          "content": {
            "application/json": {
              "schema": {
                "properties": {
                  "documentIds": {
                    "description": "List of Yokoy invoice IDs to be exported (only required if `exportScope` is `documentIds`)",
                    "items": {
                      "type": "string"
                    },
                    "type": "array"
                  },
                  "earliestPostingDate": {
                    "description": "Earliest allowed posting date. For invoices with an earlier posting date, the posting date is replaced with the earliest allowed posting date (to avoid posting to already closed books).\nThe earlier posting date must follow these rules:\n- it must be an ISO date in the format YYYY-MM-DD (e.g. 2025-03-18)\n- it must be within 1 year (both past and future) of when an export was triggered.\nFor example, if the date on which you trigger the export job is 2025-03-18, then any date between `2024-03-18` and `2026-03-18` is valid.\n",
                    "example": "2023-03-31",
                    "pattern": "\\d{4}-\\d{2}-\\d{2}",
                    "type": "string"
                  },
                  "exportScope": {
                    "description": "Determines the expenses to be exported. You can export either all invoices in the scope of the export facility that are ready for export are exported (`all`) or a determined set of invoices that are specified by their Yokoy unique IDs (`documentIds`).",
                    "enum": [
                      "all",
                      "documentIds"
                    ],
                    "example": "all",
                    "type": "string"
                  },
                  "exporterId": {
                    "description": "Yokoy unique ID of the user on behalf of which the export job is run. The user must have the finance role for the legal entity to trigger an export.",
                    "example": "zbRCb62OlcF8WcuOKVs9",
                    "type": "string"
                  }
                },
                "required": [
                  "exportScope",
                  "exporterId",
                  "earliestPostingDate"
                ],
                "type": "object"
              }
            }
          },
          "required": true
        },
        "responses": {
          "200": {
            "content": {
              "application/json": {
                "schema": {
                  "properties": {
                    "resource": {
                      "description": "Task ID of the export job",
                      "example": "h6tplNlvNxnHUpeAwd7D",
                      "type": "string"
                    }
                  },
                  "type": "object"
                }
              }
            },
            "description": "OK"
          },
          "204": {
            "description": "Nothing to export"
          },
          "400": {
            "content": {
              "application/json": {
                "example": {
                  "code": 400,
                  "message": "Invalid request body"
                },
                "schema": {
                  "$ref": "#/components/schemas/Error"
                }
              }
            },
            "description": "The provided request body is invalid"
          },
          "401": {
            "$ref": "#/components/responses/Unauthorized"
          },
          "403": {
            "$ref": "#/components/responses/Forbidden"
          },
          "404": {
            "$ref": "#/components/responses/NotFound"
          },
          "429": {
