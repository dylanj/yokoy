    "schemas": {
      "AdditionalCategoryItem": {
        "properties": {
          "categoryId": {
            "description": "Yokoy unique ID of the expense category.",
            "example": "1WOspYIfp6",
            "pattern": "[\\w-]+",
            "type": "string"
          },
          "costCenterId": {
            "description": "Yokoy unique ID of the cost object.",
            "example": "Mt34DVcI8R2sdLutWViu",
            "nullable": true,
            "pattern": "[\\w-]+",
            "type": "string"
          },
          "gross": {
            "description": "Gross amount allocated to the additional category. For each additional category, the gross amount is subtracted from the total claim.",
            "example": 10.0,
            "type": "number"
          },
          "taxRateId": {
            "description": "Yokoy unique ID of the tax rate object.",
            "example": "06x2u4nagAMEq3gGMoch",
            "nullable": true,
            "pattern": "[\\w-]+",
            "type": "string"
          }
        },
        "type": "object"
      },
      "AdvancedTaxRate": {
        "allOf": [
          {
            "$ref": "#/components/schemas/TaxRate"
          }
        ],
        "properties": {
          "components": {
            "allOf": [
              {
                "$ref": "#/components/schemas/TaxComponents"
              }
            ],
            "nullable": false
          }
        },
        "required": [
          "components"
        ],
        "type": "object"
      },
      "CardAccount": {
        "properties": {
          "accountNumber": {
            "description": "Associated account number. Unactivated accounts are indicated by an empty value.\nFor CHF/EUR accounts, it corresponds to account's IBAN.\nFor GBP accounts, it corresponds to the account's account number. If the currency is GBP, then property `sortCode` is also provided. For other currencies, this property is not provided.\n",
            "example": "GB00MOCK00000000000000",
            "type": "string"
          },
          "created": {
            "description": "Timestamp (date and time) when the card account was created. Expressed in ISO 8601 format. Coordinated Universal Time (UTC).",
            "example": "2024-02-29T11:08:45.478Z",
            "format": "date-time",
            "nullable": true,
            "type": "string"
          },
          "currency": {
            "description": "Card account currency. ISO 4217 three-letter code.",
            "example": "GBP",
            "type": "string"
          },
          "id": {
            "description": "Yokoy unique ID of a card account.",
            "example": "abc_ABC-09",
            "pattern": "[\\w-]+",
            "type": "string"
          },
          "lastModified": {
            "description": "Timestamp (date and time) when the card account was last modified. Expressed in ISO 8601 format. Coordinated Universal Time (UTC).",
            "example": "2024-03-15T17:08:45.478Z",
            "format": "date-time",
            "nullable": true,
            "type": "string"
          },
          "provider": {
            "description": "Associated card program",
            "enum": [
              "Yokoy Business Prepaid Mastercard",
              "Yokoy Platinum Visa"
            ],
            "example": "Yokoy Platinum Visa",
            "type": "string"
          },
          "sortCode": {
            "description": "Exclusive of GBP accounts. It corresponds to account's sort code.",
            "example": "00-00-00",
            "nullable": true,
            "type": "string"
          },
          "status": {
            "description": "Status of the card account.\n  - `0`: Account was requested.\n  - `1`: Account is open. Cards can be ordered.\n  - `2`: Account is closed. Cards can no longer be ordered.\n  - `3`: Account request was denied.\n",
            "enum": [
              0,
              1,
              2,
              3
            ],
            "type": "number"
          }
        },
        "required": [
          "id",
          "currency",
          "status",
          "accountNumber",
          "provider"
        ],
        "type": "object"
      },
      "CardAccountBalance": {
        "properties": {
          "available": {
            "description": "Available balance of the card account that can be used for purchases. It corresponds to the balance plus the reservations.",
            "example": 8641.42,
            "type": "number"
          },
          "balance": {
            "description": "Current total balance of the card account.",
            "example": 10000,
            "type": "number"
          },
          "reservations": {
            "description": "Reserved amount of the card account that is currently blocked by merchants or not yet cleared. This must be a negative number.",
            "example": -1358.58,
            "type": "number"
          }
        },
        "required": [
          "balance",
          "available",
          "reservations"
        ],
        "type": "object"
      },
      "Category": {
        "properties": {
          "accountReference": {
            "description": "Account (ERP). Expense account on which the expense is booked.",
            "example": "6300",
            "type": "string"
          },
          "chargeToEmployee": {
            "description": "Only applies to private expenses that are paid with the company card. If enabled, the expense is booked on the user account instead of the expense account.",
            "example": false,
            "nullable": true,
            "type": "boolean"
          },
          "customInformation": {
            "additionalProperties": {
              "type": "string"
            },
            "description": "Dictionary of custom information attributes associated with the category.",
            "example": {
              "externalId": "Cat1"
            },
            "nullable": true,
            "type": "object"
          },
          "id": {
            "description": "Yokoy unique ID of the expense category.",
            "example": "9L7rovNzNhTCsJSTkbfq",
            "pattern": "[\\w-]+",
            "readOnly": true,
            "type": "string"
          },
          "name": {
            "description": "Name of the expense category.",
            "example": "Lunch",
            "type": "string"
          },
          "statusActive": {
            "description": "Status of the expense category. Only active categories can be used for new expenses.",
            "example": true,
            "type": "boolean"
          }
        },
        "required": [
          "name",
          "accountReference",
          "statusActive"
        ],
        "type": "object"
      },
      "CompanyCard": {
        "properties": {
          "accountReference": {
            "description": "Creditor number (ERP).",
            "example": 6300,
            "type": "string"
          },
          "cardReference": {
            "description": "External reference to the company card.",
            "example": "card01",
            "nullable": true,
            "type": "string"
          },
          "currency": {
            "description": "Currency of the card. ISO 4217 three-letter code.",
            "example": "CHF",
            "type": "string"
          },
          "description": {
            "description": "Description of the card.",
            "example": "Company card for IT department.",
            "nullable": true,
            "type": "string"
          },
          "id": {
            "description": "Yokoy unique ID of the card.",
            "example": "Y6c2p3G0x",
            "pattern": "[\\w-]+",
            "readOnly": true,
            "type": "string"
          },
          "name": {
            "description": "Name of the card. This name is used to identify the card in Yokoy only.",
            "example": "Card for Alex Perez.",
            "type": "string"
          },
          "number": {
            "description": "The card number. Any string can be supplied. Only the last four characters are returned. The renaming digits are padded with stars. Queries can only be made using the `endswith`` operator on four or less characters. For example, 'number ew \"1234\"'.",
            "example": null,
            "type": "string"
          },
          "ownerId": {
            "description": "Yokoy unique ID of the user who owns the card.",
            "example": "9L7rovNzNhTCsJSTkbfq",
            "pattern": "[\\w-]+",
            "type": "string"
          },
          "statusActive": {
            "description": "Status of the card, whether the card is active or inactive.",
            "example": true,
            "type": "boolean"
          }
        },
        "required": [
          "name",
          "ownerId",
          "statusActive",
          "accountReference",
          "number",
          "currency"
        ],
        "type": "object"
      },
      "CostCenter": {
        "properties": {
          "accessType": {
            "description": "Defines the users that can submit expenses, trips, and invoices to the cost object.\n - `all`: Any Yokoy user can use this cost object.\n - `finance`: Only finance users can use this cost object.\n - `specificUsers`: Only finance users and an explicitly defined list of users are allowed. Users can be specified with the `userAccessGrants` property of the cost object PATCH endpoint.\n",
            "enum": [
              "all",
              "finance",
              "specificUsers"
            ],
            "example": "specificUsers",
            "type": "string"
          },
          "approvalLimit": {
            "description": "Approval limit in the the legal entity‘s currency.",
            "example": 999999,
            "minimum": 0.0,
            "nullable": true,
            "type": "number"
          },
          "approverId": {
            "description": "Yokoy user ID that identifies the cost object's approver.",
            "example": "9L7rovNzNhTCsJSTkbfq",
            "nullable": true,
            "pattern": "[\\w-]+",
            "type": "string"
          },
          "autoApprovalLimit": {
            "description": "Auto approval limit in the legal entity‘s currency.",
            "example": 100000.0,
            "minimum": 0.0,
            "nullable": true,
            "type": "number"
          },
          "code": {
            "description": "Code (ERP). External account number associated with the cost object.",
            "example": "C33998",
            "type": "string"
          },
          "customInformation": {
            "additionalProperties": {
              "description": "Dictionary of custom information attributes associated with the cost object.",
              "example": {
                "externalId": "00001C"
              },
              "type": "string"
            },
            "nullable": true,
            "type": "object"
          },
          "delegateExpiry": {
            "description": "Expiry date and time of the cost object's delegate.",
            "example": "Fri, 14 Aug 2020 21:59:59 GMT",
            "nullable": true,
            "readOnly": true,
            "type": "string"
          },
          "delegateId": {
            "description": "Yokoy user ID that identifies the cost object‘s delegate.",
            "example": "h9cQajbG",
            "nullable": true,
            "pattern": "[\\w-]+",
            "type": "string"
          },
          "description": {
            "description": "Description of the cost object.",
            "example": "IT costs related to employees, hardware, and software.",
            "nullable": true,
            "type": "string"
          },
          "id": {
            "description": "Yokoy unique ID of the cost object (cost center).",
            "example": "uhmkC9zMzn",
            "pattern": "[\\w-]+",
            "readOnly": true,
            "type": "string"
          },
          "name": {
            "description": "Name of the cost object.",
            "example": "IT department",
            "type": "string"
          },
          "parentId": {
            "description": "Yokoy unique ID of the parent cost object.",
            "example": "9rL5X8PJ",
            "nullable": true,
            "pattern": "[\\w-]+",
            "type": "string"
          },
          "scopes": {
            "description": "Scopes of the cost object. Defines whether cost objects can be used in travel, expenses, invoices or both.",
            "example": [
              "travel",
              "expenses",
              "invoices"
            ],
            "items": {
              "enum": [
                "travel",
                "expenses",
                "invoices"
              ],
              "type": "string"
            },
            "nullable": true,
            "type": "array"
          },
          "statusActive": {
            "description": "Status of the cost object. Only active cost objects can be used in travel, expenses, trips, and invoices.",
            "example": true,
            "type": "boolean"
          }
        },
        "required": [
          "code",
          "name"
        ],
        "type": "object"
      },
      "CostCenterItem": {
        "properties": {
          "id": {
            "description": "Yokoy unique ID of the cost object (cost center).",
            "example": "CZwA376CfxtOyjg43LRU",
            "pattern": "[\\w-]+",
            "type": "string"
          },
          "pctWeight": {
            "description": "Percentage of the cost to be assigned to the cost object.",
            "maximum": 100.0,
            "minimum": 0.0,
            "type": "number"
          }
        },
        "type": "object"
      },
